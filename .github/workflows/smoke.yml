# Proves both onboarding paths in the README on every push: the visualizer builds from a clean
# npm ci, and the model track installs + trains + samples from scratch on a fresh machine.
# If clone-and-run ever breaks, this goes red before a visitor finds out.
# (No lint here on purpose: the repo has ~78 pre-existing lint findings; this gate is "does it run".)
name: smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  viz:
    name: visualizer builds (npm ci + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: viz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: viz/package-lock.json
      - run: npm ci
      - run: npm run build

  model:
    name: model track (install + 20-iter train + sample)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: pip install -r requirements-model.txt
      - name: Train a few iterations (downloads Tiny Shakespeare, writes a checkpoint)
        run: python -m model.train --max_iters 20 --eval_interval 10 --eval_iters 5 --sample_tokens 40
      - name: Generate from the fresh checkpoint (the README's sample command)
        run: python -m model.sample --prompt "ROMEO:" --tokens 40 --temperature 0.8 --top_k 40
