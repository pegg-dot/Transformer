name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: transformer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visualizer:
    name: visualizer build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: viz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viz/package-lock.json
      - run: npm ci
      - name: Reject high-severity published dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run build

  model:
    name: model execution smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: pip install -r requirements-model.txt
      - name: Exercise training path
        run: python -m model.train --max_iters 20 --eval_interval 10 --eval_iters 5 --sample_tokens 40
      - name: Exercise sampling path
        run: python -m model.sample --prompt "ROMEO:" --tokens 40 --temperature 0.8 --top_k 40
