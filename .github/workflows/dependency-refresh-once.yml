name: dependency-refresh-once

on:
  push:
    branches: [public/portfolio-showcase]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[dependency-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: public/portfolio-showcase
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viz/package-lock.json
      - name: Refresh package lock and safe dependency fixes
        working-directory: viz
        run: |
          npm install --ignore-scripts
          npm audit fix --ignore-scripts || true
      - name: Commit dependency updates
        run: |
          if git diff --quiet -- viz/package.json viz/package-lock.json; then
            echo "No dependency changes were required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add viz/package.json viz/package-lock.json
            git commit -m "Refresh visualizer dependency security fixes [dependency-refresh]"
            git push origin HEAD:public/portfolio-showcase
          fi
      - name: Report remaining high-severity advisories
        working-directory: viz
        run: npm audit --package-lock-only --audit-level=high
